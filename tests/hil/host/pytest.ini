[pytest]
# Only collect the harness's own tests, and never descend into the venv (which
# holds installed packages' own conftests). Without this, a no-argument run
# (`pytest --port COM5`) wanders into .venv and fails to register the local
# conftest options (e.g. --companion-port).
testpaths = .
norecursedirs = .venv* .pytest_cache __pycache__ build*
# The harness talks to an ALREADY-FLASHED board over raw pyserial (see
# conftest.py's `agent` fixture) — pytest does not flash and does not use
# pytest-embedded's serial service (that layer left the port in a state this
# DevKit hangs on). Flash the agent first (idf.py or the VS Code task - auto-reset
# works, see WIRING.md section 13), then:
#     pytest . --port COM5 --companion-port COM7
# `--port` is provided by the installed pytest-embedded plugin.
addopts = -ra
filterwarnings =
    ignore:record_xml_attribute is an experimental feature
markers =
    two_board: test requires two boards wired together (DUT + COMPANION)
    needs_xcvr: test additionally needs a CAN transceiver + termination
    needs_slave: test additionally needs the e32p_spi_slave / e32p_i2c_slave companion
    needs_canable: test additionally needs a CANable on the bus (skipped without --canable)
